networks:
    1panel-network:
        external: true
services:
    alist:
        container_name: ${CONTAINER_NAME}
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        environment:
            - PUID=0
            - PGID=0
            - UMASK=022
        image: xhofe/alist:v3.64.0
        labels:
            createdBy: Apps
        networks:
            - 1panel-network
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:5244
            - ${HOST_IP}:${PANEL_APP_PORT_S3}:5246
        restart: always
        volumes:
            - ./data/data:/opt/alist/data
            - ./data/mnt:/mnt/data
